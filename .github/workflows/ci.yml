name: Flow-Kit CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── JOB 1: CODE INTEGRITY & MONOREPO BUILD ───
  build-and-verify:
    name: Build & Typecheck Monorepo
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:password123@localhost:5432/flowkit?schema=public"
      JWT_SECRET: "ci-test-secret-key-32-chars-long-minimum!!"
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @flow-kit/database db:generate

      - name: Build Web SDKs
        run: |
          pnpm --filter @flow-kit/web build
          pnpm --filter @flow-kit/react build

      - name: Build Backend API
        run: pnpm --filter @flow-kit/api build

      - name: Build Dashboard (Next.js)
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:4000"
        run: pnpm --filter @flow-kit/dashboard build

  # ─── JOB 2: DOCKER CONTAINER IMAGES VERIFICATION ───
  docker-build:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    needs: build-and-verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: flowkit-api:test

      - name: Build Dashboard Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000
          tags: flowkit-dashboard:test
